name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and smoke test
        shell: pwsh
        run: |
          $failed = $false
          try { ./ci/build-windows.ps1 -OutputDirectory out/windows -SmokeTest -SmokeSeconds 180 *>&1 | Tee-Object -FilePath build.log } catch { $failed = $true; $_ | Out-String | Add-Content build.log }
          if ($failed) {
            Get-Content build.log | Where-Object { $_ -match 'error|Exception|compilation|FAIL|   at |FAIL|PASS|smoke' } | Select-Object -First 40 | ForEach-Object { Write-Host ('::error::' + ($_ -replace '[\r\n%]', ' ')) }
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: out/windows/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Setup
          path: out/windows/Capri-Setup.exe
      - name: Crew test
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          npm install -g opencode-ai@1.19.5 --no-audit --no-fund --loglevel=error *>&1 | Out-Null
          try { ./ci/crew-test.ps1 *>&1 | Tee-Object -FilePath crew.log } catch { $failed = $true; $_ | Out-String | Add-Content crew.log }
          if ($failed) {
            Get-Content crew.log | Where-Object { $_ -match 'FAIL|error|Exception|failed' } | Select-Object -First 30 | ForEach-Object { Write-Host ('::error::' + ($_ -replace '[\r\n%]', ' ')) }
            exit 1
          }

  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Capri-Setup
          path: dist
      - name: Publish the release her updater installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*AssemblyVersion("\([0-9.]*\)").*/\1/p' app/AssemblyInfo.cs)
          tag="v$version"
          notes=$(git log -1 --format=%s -- app/AssemblyInfo.cs)
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released"; exit 0; fi
          cd dist
          mv Capri-Setup.exe "Capri-Setup-$version.exe"
          sha256sum "Capri-Setup-$version.exe" > SHA256SUMS.txt
          gh release create "$tag" "Capri-Setup-$version.exe" SHA256SUMS.txt --title "Capri $version" --notes "$notes" --target "$GITHUB_SHA"

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/linux
      - name: Install a test desktop
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xvfb xauth openbox xcompmgr libice6 libsm6 libfontconfig1
      - name: Smoke test
        timeout-minutes: 5
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; xcompmgr & sleep 1; out/linux/Capri --smoke "$PWD/smoke/linux"' || true
          cat smoke/linux/smoke-test.txt
          ! grep -q '^FAIL' smoke/linux/smoke-test.txt
          test "$(grep -c '^PASS' smoke/linux/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/mac
      - name: Smoke test
        timeout-minutes: 5
        run: |
          out/mac/Capri --smoke "$PWD/smoke/mac" || true
          cat smoke/mac/smoke-test.txt
          ! grep -q '^FAIL' smoke/mac/smoke-test.txt
          test "$(grep -c '^PASS' smoke/mac/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-mac
          path: smoke
